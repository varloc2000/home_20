version: '3.8'

services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:latest
    container_name: wg-easy
    restart: unless-stopped
    environment:
      - WG_HOST=${CI_SSH_HOST}
      - WG_ADMIN_PASSWORD_HASH=${CI_VPN_ADMIN_PASSWORD}
      - WG_DEFAULT_ADDRESS=10.8.0.x
      - WG_ALLOWED_IPS=0.0.0.0/0
      - WG_PERSISTENT_KEEPALIVE=25
      - WG_DEFAULT_DNS=1.1.1.1,8.8.8.8
      - WG_POST_UP=iptables -t nat -A POSTROUTING -s 10.8.0.0/24 -o eth0 -j MASQUERADE; iptables -A FORWARD -s 10.8.0.0/24 -j ACCEPT; iptables -A FORWARD -d 10.8.0.0/24 -j ACCEPT
      - WG_POST_DOWN=iptables -t nat -D POSTROUTING -s 10.8.0.0/24 -o eth0 -j MASQUERADE; iptables -D FORWARD -s 10.8.0.0/24 -j ACCEPT; iptables -D FORWARD -d 10.8.0.0/24 -j ACCEPT
    volumes:
      - ./wireguard/data:/etc/wireguard
    ports:
      - "51820:51820/udp"
    networks:
      - traefik-network
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vpn.rule=Host(`vpn.home20.run.place`)"
      - "traefik.http.routers.vpn.entrypoints=websecure"
      - "traefik.http.routers.vpn.tls.certresolver=myresolver"
      - "traefik.http.services.vpn.loadbalancer.server.port=51821"

  homeassistant:
    container_name: homeassistant
    image: "ghcr.io/home-assistant/home-assistant:stable"
    volumes:
      - ./homeassistant/config:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      TZ: "Europe/Warsaw"
    restart: unless-stopped
    networks:
      - traefik-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homeassistant.rule=Host(`homeassistant.home20.run.place`)"
      - "traefik.http.routers.homeassistant.entrypoints=websecure"
      - "traefik.http.routers.homeassistant.tls.certresolver=myresolver"
      - "traefik.http.services.homeassistant.loadbalancer.server.port=8123"
      - "traefik.docker.network=traefik-network"
      - "traefik.http.middlewares.homeassistant-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.homeassistant.middlewares=homeassistant-headers"

  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto:latest
    restart: unless-stopped
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - traefik-network

  zigbee2mqtt:
    container_name: zigbee2mqtt
    image: koenkk/zigbee2mqtt:latest
    restart: unless-stopped
    command: >
      sh -c "
      WG_IP=\$$(getent hosts wg-easy | awk '{print \$1}');
      if [ -n \"\$$WG_IP\" ]; then
        ip route add 10.8.0.0/24 via \$$WG_IP 2>/dev/null || true;
      fi;
      exec /sbin/tini -- docker-entrypoint.sh node index.js
      "
    cap_add:
      - NET_ADMIN  # Нужно только для добавления одного маршрута при старте
    environment:
      TZ: "Europe/Warsaw"
      # --- Overrides for configuration.yaml ---
      ZIGBEE2MQTT_CONFIG_MQTT_SERVER: "${CI_MQTT_SERVER}"
      ZIGBEE2MQTT_CONFIG_SERIAL_PORT: "tcp://${CI_DEVICE_IP}:${CI_DEVICE_PORT}"
      ZIGBEE2MQTT_CONFIG_SERIAL_ADAPTER: "ember"
    volumes:
      - ./zigbee2mqtt/data:/app/data
      - /run/udev:/run/udev:ro
    depends_on:
      - mosquitto
      - wg-easy
    networks:
      - traefik-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.zigbee2mqtt.rule=Host(`z2m.home20.run.place`)"
      - "traefik.http.routers.zigbee2mqtt.entrypoints=websecure"
      - "traefik.http.routers.zigbee2mqtt.tls.certresolver=myresolver"
      - "traefik.http.services.zigbee2mqtt.loadbalancer.server.port=8080"
      - "traefik.docker.network=traefik-network"

networks:
  traefik-network:
    external: true
